description:
  en: 'Run Linux commands from Windows through WSL, essentially matching a native Linux DSH for command execution: one fresh shell per call, optional stdin, long builds as background jobs the built-in job tools read back, automatic Windows/WSL path translation, a destructive-command guard, and a capability report (WSL version, systemd, cgroup, GPU passthrough, docker, mounted drives, and both config files).'
  zh: '在 Windows 上通过 WSL 执行 Linux 命令，命令执行能力基本对齐 Linux 原生 DSH：每次调用独立 shell、可喂 stdin、长任务可作为后台作业并用内置 job 工具读回、Windows/WSL 路径自动转换、危险命令守卫，以及能力体检（WSL 版本、systemd、cgroup、GPU 直通、docker、挂载盘与两侧配置）。'
