description:
  en: 'WSL tools for DSH: run Linux commands (fresh shell, exit codes, timeouts, truncation spill, stdin), convert Windows↔WSL paths, report the WSL environment, check a project''s toolchain against the distribution — including commands that are really Windows binaries — install the missing pieces from a fixed recipe list, and work inside the terminal you already have open. Long builds become background jobs, destructive commands need consent, and root is a panel switch. WSL calls run below the DSH sandbox.'
  zh: 'DSH 的 WSL 工具：执行 Linux 命令（全新 shell、退出码、超时、截断落盘、可喂 stdin）、Windows↔WSL 路径互转、WSL 环境体检、对照项目清单检查发行版缺什么（含那些其实是 Windows 二进制的命令）、按固定配方补装缺失的工具链，并可在你已打开的终端里工作。长任务转后台作业，危险命令需显式放行，root 执行是一项面板开关；WSL 调用位于 DSH 沙箱层之下。'
